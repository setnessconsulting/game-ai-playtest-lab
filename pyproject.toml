[project]
name = "game-ai-playtest-lab"
version = "0.1.0"
description = "Minimal experiment harness for comparing AI game-playtesting workflows."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Third-party deps needed to import the pinned GameWorld checkout on sys.path
# while running the unittest suite. Keep the runtime package dep-free.
test = [
  "requests",
  "pyyaml",
  "pillow",
  "jinja2",
  "colorlog",
]

[project.scripts]
playtest-lab = "playtest_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["playtest_lab"]
