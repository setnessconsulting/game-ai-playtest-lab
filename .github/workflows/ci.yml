name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test extras
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Checkout pinned GameWorld
        env:
          GAMEWORLD_REPO: https://github.com/gameworld-project/GameWorld.git
          GAMEWORLD_REV: 3c26bdab436800fd61ef40543b64ca40d12c7e4a
        run: |
          mkdir -p .frameworks
          git clone --filter=blob:none "$GAMEWORLD_REPO" .frameworks/gameworld-upstream
          git -C .frameworks/gameworld-upstream checkout --detach "$GAMEWORLD_REV"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
