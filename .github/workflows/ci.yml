name: CI

# PR validation is the required `jenkins-pr-gate` check from the qualified
# game-ai-playtest-lab-python312 Jenkins lane. This Actions workflow is
# owner-dispatched verification only; the automatic push trigger was removed
# in API-455 so branches and main do not repeat that validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false

      - name: Install locked test and build dependencies
        run: |
          uv sync --locked --extra test --group build --no-build-isolation --no-install-project
          uv pip install --python .venv --no-deps --no-build-isolation -e .

      - name: Checkout pinned GameWorld
        env:
          GAMEWORLD_REPO: https://github.com/gameworld-project/GameWorld.git
          GAMEWORLD_REV: 3c26bdab436800fd61ef40543b64ca40d12c7e4a
        run: |
          mkdir -p .frameworks
          git clone --filter=blob:none "$GAMEWORLD_REPO" .frameworks/gameworld-upstream
          git -C .frameworks/gameworld-upstream checkout --detach "$GAMEWORLD_REV"

      - name: Unit tests
        run: uv run --locked --extra test --group build --no-sync python -m unittest discover -s tests -p "test_*.py" -v
